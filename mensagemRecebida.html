  <style>
    .comments-section {
      padding-top: 120px;

    /* Correção: Adicionado o ponto (.) de classe */
    .comments-title {
        text-align: left;
        font-size: 32px;

        color: #1a202c;
        margin-bottom: 100px;
        padding-left: 20px;
    }

    #lista {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding: 0 20px;
    }

    .card {
      position: relative;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(183, 71, 71, 0.1);
      transition: 0.3s;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
    }

    .card:nth-child(4n+1) { background: #fff3b0; }
    .card:nth-child(4n+2) { background: #ffd6e0; }
    .card:nth-child(4n+3) { background: #d0ebff; }
    .card:nth-child(4n+4) { background: #e6fcf5; }

    .card p {
      font-size: 14px;
      color: #4a5568;
    }

    .card .enderecoOnline a {
      color: #4f46e5;
      font-size: 12px;
      text-decoration: none;
    }

    .card p strong {
      color: #2d3748;
      font-weight: 600;
    }

    .card p:last-child {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      color: #2d3748;
      font-style: italic;
    }

    @media (max-width: 768px) {
      .comments-title {
        font-size: 1.8rem;
      }

      #lista {
        grid-template-columns: 1fr;
        padding: 0 10px;
      }

      .card {
        padding: 20px;
      }
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(183, 71, 71, 0.2);
    }

    .card h3 {
      padding-right: 30px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card h3 a {
      color: #2d3748;
      text-decoration: none;
      transition: color 0.3s;
    }

    .card h3 a:hover {
      color: #4f46e5;
    }
  </style>

  <!-- Supabase Comments Script -->
  <script>
    const supabaseUrl = "https://cdhjzkmlucahtllfpdlx.supabase.co";
    // Nota: Em produção, evite expor chaves de API diretamente se houver permissões de escrita abusivas. Para leitura pública (anon), está correto.
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkaGp6a21sdWNhaHRsbGZwZGx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNDgxNzMsImV4cCI6MjA5MDgyNDE3M30.ZaP_y-A2t32z8FRT4vAA8xsMqjhsdA0QuQIGTP5f36g";

    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    async function carregarComentarios() {
        const { data, error } = await supabaseClient
            .from("comentarios")
            .select("*")
            .order("id", { ascending: false });

        if (error) {
            console.error("Erro ao carregar dados do Supabase:", error);
            return;
        }

        const lista = document.getElementById("lista");
        lista.innerHTML = "";

        if (data && data.length > 0) {
            data.forEach(item => {
                const div = document.createElement("div");
                div.classList.add("card");

                const assunto = encodeURIComponent("Resposta ao seu comentário - Equipe GRIOT");
                const mensagem = encodeURIComponent(`Olá ${item.nome},\n\nRecebemos sua sugestão:\n\n"${item.msg}"\n\nResposta:\n`);

                div.innerHTML = `
                    <h3>
                      <a href="mailto:${item.email}?subject=${assunto}&body=${mensagem}">
                        ${item.nome} ${item.sobrenome || ''}
                      </a>
                    </h3>
                    <p><strong>Email:</strong> ${item.email}</p>
                    <p>${item.msg}</p>
                `;
                lista.appendChild(div);
            });
        } else {
            lista.innerHTML = "<p>Nenhuma sugestão enviada até o momento.</p>";
        }
    }

    // Correção: Executa a função assim que a página termina de carregar
    document.addEventListener("DOMContentLoaded", () => {
        carregarComentarios();
    });
  </script>
